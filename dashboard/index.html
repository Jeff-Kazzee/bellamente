<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Eunoia — Inspect</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%2356d1c4'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2356d1c4' stroke-opacity='.5' stroke-width='1.5'/%3E%3C/svg%3E" />
<style>
  /* ---- Eunoia inspect dashboard — self-contained, no external assets (WASM-clean, single-binary) ---- */
  :root{
    --bg:#0a0c10; --bg2:#0e1116; --panel:#12161c; --panel2:#161b22; --raise:#1b212a;
    --border:#212832; --border-soft:#191e26; --hair:rgba(255,255,255,.06);
    --text:#e7ebf0; --dim:#98a2b1; --faint:#8a94a2;
    --accent:#56d1c4; --accent-ink:#0a0c10; --accent-dim:rgba(86,209,196,.13);
    --violet:#9a8cf2; --violet-dim:rgba(154,140,242,.14);
    --amber:#e2b877; --amber-dim:rgba(226,184,119,.14);
    --danger:#ec8873; --danger-dim:rgba(236,136,115,.14);
    --mono:ui-monospace,"SF Mono","Cascadia Code","Fira Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    --r:12px; --r-sm:8px; --sb:248px;
    --shadow:0 10px 34px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important} /* author !important beats .app{display:grid}, so the hidden attr truly hides */
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 78% -8%,#12181f 0,var(--bg) 58%);
    color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:.1px;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  ::selection{background:var(--accent-dim)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#232a34;border-radius:20px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#2c3542;background-clip:content-box}

  .app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}

  /* ---- sidebar ---- */
  .side{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
    padding:20px 14px;border-right:1px solid var(--border-soft);background:linear-gradient(180deg,var(--bg2),transparent 40%);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .brand .mark{width:26px;height:26px;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(86,209,196,.35))}
  .brand b{font-size:16px;font-weight:650;letter-spacing:.2px}
  .brand small{display:block;color:var(--faint);font-size:11px;letter-spacing:.32px;text-transform:uppercase;margin-top:1px}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .nav a{
    display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--dim);
    font-weight:520;transition:background .14s,color .14s;position:relative;
  }
  .nav a svg{width:17px;height:17px;opacity:.8;flex:0 0 auto}
  .nav a:hover{background:#141922;color:var(--text)}
  .nav a.on{background:var(--accent-dim);color:var(--text)}
  .nav a.on svg{opacity:1;color:var(--accent)}
  .nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .side .spacer{flex:1}
  .conn{display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid var(--border-soft);border-radius:var(--r-sm);background:#0f141b;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .dot.ok{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-dim)}
  .conn .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conn button{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  .conn button:hover{color:var(--accent)}

  /* ---- main ---- */
  .main{min-width:0;padding:26px 30px 60px;max-width:1180px}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h1{margin:0;font-size:21px;font-weight:620;letter-spacing:.2px}
  .pagehead .sub{color:var(--faint);font-size:13px;margin-top:3px}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--border);
    background:#10151c;color:var(--dim);font-size:12px;font-weight:520;transition:.14s;white-space:nowrap;
  }
  .chip:hover{border-color:#2b333f;color:var(--text)}
  .chip.on{background:var(--accent-dim);border-color:transparent;color:var(--text)}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--border);
    background:#131922;color:var(--text);font-weight:560;font-size:13px;transition:.14s;
  }
  .btn:hover{border-color:#2f3846;background:#161d27}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:650}
  .btn.primary:hover{background:#6bdccf}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{
    font:inherit;color:var(--text);background:#0f141b;border:1px solid var(--border);border-radius:var(--r-sm);
    padding:9px 11px;outline:none;transition:border-color .14s,box-shadow .14s;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
  label.field{display:block}
  label.field .lab{display:block;font-size:11px;letter-spacing:.32px;text-transform:uppercase;color:var(--faint);margin:0 0 6px 2px}

  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border-soft);border-radius:var(--r)}
  .muted{color:var(--dim)}.faint{color:var(--faint)}.mono{font-family:var(--mono)}
  .empty{border:1px dashed var(--border);border-radius:var(--r);padding:46px 20px;text-align:center;color:var(--faint)}
  .empty b{display:block;color:var(--dim);font-weight:560;margin-bottom:6px;font-size:15px}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;letter-spacing:.2px;border:1px solid transparent;background:#151b23;color:var(--dim)} /* default fill so unknown statuses (proxy: context_injected/passthrough) still render as pills */
  .b-search{background:var(--accent-dim);color:#8fe6db}
  .b-proxy{background:var(--violet-dim);color:#bcb2f6}
  .b-tool{background:var(--amber-dim);color:#eccf9a}
  .b-ok{background:var(--accent-dim);color:#8fe6db}
  .b-timeout,.b-error{background:var(--danger-dim);color:#f0a595}
  .b-mem{background:#151b23;color:var(--dim);border-color:var(--border)}
  .b-vector{background:var(--accent-dim);color:#8fe6db}
  .b-keyword{background:var(--amber-dim);color:#eccf9a}
  .b-both{background:var(--violet-dim);color:#bcb2f6}
  .tag{display:inline-block;padding:2px 7px;border-radius:5px;background:#141a22;border:1px solid var(--border);color:var(--dim);font-size:11px;font-family:var(--mono)}

  /* trace list */
  .rows{display:flex;flex-direction:column;border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden}
  .row{display:grid;grid-template-columns:150px 96px 1fr 74px 88px;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s}
  .row:last-child{border-bottom:0}
  .row:hover{background:#131922}
  .row .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .row .when{color:var(--faint);font-size:12.5px;font-family:var(--mono)}
  .row .num{text-align:right;font-family:var(--mono);color:var(--dim);font-size:12.5px}
  .row .num b{color:var(--text);font-weight:600}

  /* trace detail hero */
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;margin-bottom:14px}
  .back:hover{color:var(--accent)}
  .hero{padding:22px 24px;margin-bottom:16px}
  .hero .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .hero .top .when{margin-left:auto;color:var(--faint);font-size:12.5px;font-family:var(--mono)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat{background:#0f141b;border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:13px 15px}
  .stat .k{font-size:11px;letter-spacing:.32px;text-transform:uppercase;color:var(--faint)}
  .stat .v{font-size:24px;font-weight:640;font-family:var(--mono);margin-top:4px;letter-spacing:-.5px}
  .stat .v small{font-size:13px;color:var(--faint);font-weight:500;margin-left:3px}
  .qbox{background:#0f141b;border:1px solid var(--border-soft);border-left:2px solid var(--accent);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:18px}
  .qbox .k{font-size:11px;letter-spacing:.32px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .qbox .qt{font-size:16px;color:var(--text);line-height:1.45}
  .notice{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r-sm);background:var(--violet-dim);border:1px solid rgba(154,140,242,.28);color:#cfc7f8;font-size:12.5px;line-height:1.5;margin-bottom:18px}
  .notice svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;color:var(--violet)}

  .sec{margin-top:22px}
  .sec .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .sec .hd h3{margin:0;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:600}
  .sec .hd .n{font-family:var(--mono);color:var(--faint);font-size:12px}

  .item{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:9px;transition:border-color .14s}
  .item:hover{border-color:#28303b}
  .item .ihead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
  .item .rank{font-family:var(--mono);color:var(--faint);font-size:12px;min-width:20px}
  .item .ihead .meta{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .item .content{color:var(--dim);font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .item .content.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .more{color:var(--accent);font-size:12px;margin-top:6px;display:inline-block;padding:0;background:none;border:0;cursor:pointer;font-family:inherit}
  .more:hover{text-decoration:underline}
  .item .sub{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  /* score bar */
  .score{display:flex;align-items:center;gap:9px;min-width:150px}
  .score .track{flex:1;height:6px;border-radius:99px;background:#1a212a;overflow:hidden;min-width:70px}
  .score .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#2c6f6a,var(--accent))}
  .score .val{font-family:var(--mono);font-size:12.5px;color:var(--text);min-width:52px;text-align:right}
  .score.neg .fill{background:linear-gradient(90deg,#5b4a4a,var(--danger))}

  details.raw{margin-top:22px;border:1px solid var(--border-soft);border-radius:var(--r-sm);background:#0d1117}
  details.raw>summary{cursor:pointer;padding:11px 15px;color:var(--dim);font-size:12.5px;letter-spacing:.2px;list-style:none;display:flex;align-items:center;gap:8px}
  details.raw>summary::-webkit-details-marker{display:none}
  details.raw>summary::before{content:"▸";color:var(--faint);transition:transform .15s}
  details.raw[open]>summary::before{transform:rotate(90deg)}
  details.raw pre{margin:0;padding:0 16px 16px;overflow:auto;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.55;max-height:440px}

  /* search playground */
  .play{padding:18px 20px;margin-bottom:18px}
  .play .qrow{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
  .play .qrow input{font-size:15px;padding:12px 14px}
  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .toggle{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-sm);background:#0f141b;user-select:none;cursor:pointer}
  .toggle input{width:auto}
  .toggle:has(input:disabled){opacity:.45;cursor:not-allowed}
  .runbar{display:flex;align-items:center;gap:14px;margin:16px 0}
  .runbar .res{color:var(--faint);font-size:13px;font-family:var(--mono)}
  .runbar .res a{color:var(--accent)}
  .runbar .res b{color:var(--text)}

  /* memory browser */
  .mem{padding:15px 17px;margin-bottom:9px}
  .mem .mtop{display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .mem .mtop .when{margin-left:auto;color:var(--faint);font-size:12px;font-family:var(--mono)}
  .mem .mtext{color:var(--text);font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .mem .mtext.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* connect gate */
  .gate{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate .box{max-width:430px;width:100%;padding:30px 28px;text-align:left}
  .gate .mark{width:40px;height:40px;margin-bottom:16px}
  .gate h2{margin:0 0 8px;font-size:20px;font-weight:640}
  .gate p{color:var(--dim);font-size:13.5px;line-height:1.6;margin:0 0 20px}
  .gate .row2{display:flex;gap:9px;margin-top:14px}
  .gate .hint{color:var(--faint);font-size:12px;margin-top:14px;line-height:1.55}
  .err{color:#f0a595;font-size:12.5px;margin-top:10px;min-height:16px}

  .skeleton{border:1px solid var(--border-soft);border-radius:var(--r);height:120px;background:linear-gradient(100deg,#12161c 30%,#171d25 50%,#12161c 70%);background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

  /* responsive */
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 14px;border-right:0;border-bottom:1px solid var(--border-soft)}
    .brand{padding:0 8px 0 2px}.brand small{display:none}
    .nav{flex-direction:row;margin:0}
    .nav a{padding:8px 12px}.nav a svg{display:none}.nav a.on::before{display:none}
    .side .spacer{display:none}
    .conn{margin-left:auto;padding:7px 10px}.conn .grow{max-width:120px}
    .main{padding:18px 16px 50px}
    .stats{grid-template-columns:1fr}
    .row{grid-template-columns:auto 1fr auto;grid-template-areas:"when kind lat" "q q q";gap:7px 10px;align-items:center}
    .row .when{grid-area:when}.row .kindcol{grid-area:kind;justify-self:start}
    .row .num.results{display:none}.row .num{grid-area:lat}
    .row .q{grid-area:q;white-space:normal;overflow:visible;text-overflow:clip}
  }
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6" fill="#56d1c4"/><circle cx="16" cy="16" r="13" fill="none" stroke="#56d1c4" stroke-opacity=".5" stroke-width="1.5"/></svg>
      <div><b>Eunoia</b><small>Inspect</small></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/traces" data-route="traces"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>Traces</a>
      <a href="#/search" data-route="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>Search</a>
      <a href="#/memory" data-route="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c-3 0-5 1.8-5 4.5 0 1 .4 1.9 1 2.6C6.6 11 6 12.2 6 13.5 6 16.5 8.7 19 12 19s6-2.5 6-5.5c0-1.3-.6-2.5-2-3.4.6-.7 1-1.6 1-2.6C17 4.8 15 3 12 3Z"/></svg>Memory</a>
    </nav>
    <div class="spacer"></div>
    <div class="conn" title="Local API connection">
      <span class="dot" id="dot"></span>
      <span class="grow mono" id="connlabel">not connected</span>
      <button id="disconnect" hidden>reset</button>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>

<div id="gate" hidden></div>

<script>
"use strict";
(() => {
  const $ = (s, r=document) => r.querySelector(s);
  const el = (t, a={}, kids=[]) => { const n=document.createElement(t); for(const k in a){ if(k==="class")n.className=a[k]; else if(k==="html")n.innerHTML=a[k]; else if(k.startsWith("on")&&typeof a[k]==="function")n.addEventListener(k.slice(2),a[k]); else if(a[k]!=null)n.setAttribute(k,a[k]); } for(const c of [].concat(kids)) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c)); return n; };
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const KEY_STORE = "eunoia.apikey";
  let apiKey = localStorage.getItem(KEY_STORE) || "";
  const base = location.origin;

  // ---- api ----
  async function api(path, opts={}) {
    const r = await fetch(base + path, { ...opts, headers: { "authorization": "Bearer " + apiKey, ...(opts.body ? {"content-type":"application/json"} : {}), ...(opts.headers||{}) } });
    if (r.status === 401) { const e = new Error("Unauthorized"); e.code = 401; throw e; }
    if (!r.ok) { let m = "HTTP " + r.status; try { m = (await r.json()).error || m; } catch {} const e = new Error(m); e.code = r.status; throw e; }
    return r.json();
  }

  // ---- helpers ----
  const timeAgo = iso => { if(!iso) return "—"; const d=(Date.now()-new Date(iso).getTime())/1000; if(d<60)return Math.max(0,d|0)+"s ago"; if(d<3600)return (d/60|0)+"m ago"; if(d<86400)return (d/3600|0)+"h ago"; return (d/86400|0)+"d ago"; };
  const timeUntil = iso => { if(!iso) return "—"; const d=(new Date(iso).getTime()-Date.now())/1000; if(d<=0)return "now"; if(d<60)return (d|0)+"s"; if(d<3600)return (d/60|0)+"m"; if(d<86400)return (d/3600|0)+"h"; return (d/86400|0)+"d"; };
  const fmtTime = iso => { if(!iso) return "—"; try{ return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch{return String(iso);} };
  const kindBadge = k => `<span class="badge b-${k==="tool_search"?"tool":esc(k)}">${esc(k==="tool_search"?"tool-search":k)}</span>`;
  const statusBadge = s => s && s!=="ok" ? `<span class="badge b-${esc(s)}">${esc(s)}</span>` : `<span class="badge b-ok">ok</span>`;
  const sourceBadge = s => s ? `<span class="badge b-${esc(s)}">${esc(s)}</span>` : "";

  function scoreBar(sim){
    if (typeof sim !== "number" || !isFinite(sim)) return `<span class="faint mono" style="font-size:12px">n/a</span>`;
    const pct = Math.max(0, Math.min(1, sim)) * 100;
    return `<span class="score${sim<0?" neg":""}"><span class="track"><span class="fill" style="width:${pct.toFixed(1)}%"></span></span><span class="val">${sim.toFixed(3)}</span></span>`;
  }

  function retrievedItem(it, i){
    const title = it.title ? esc(it.title) : (it.filepath ? esc(it.filepath) : "");
    const body = it.content ?? it.memory ?? ""; // live /search memory hits carry text in .memory; trace items in .content
    const long = body.length > 220;
    const meta = [ it.type?`<span class="badge b-mem">${esc(it.type)}</span>`:"", sourceBadge(it.source), it.id?`<span class="tag">${esc(String(it.id).slice(0,12))}</span>`:"" ].filter(Boolean).join("");
    const sub = [ title?`<span class="faint" style="font-size:12px">${title}</span>`:"", it.headingPath?`<span class="tag">${esc(it.headingPath)}</span>`:"", it.truncated?`<span class="faint" style="font-size:11px">clipped ${it.contentLength} chars</span>`:"" ].filter(Boolean).join("");
    const cid = "c"+i+"_"+Math.random().toString(36).slice(2,7);
    return `<div class="item">
      <div class="ihead"><span class="rank">#${i+1}</span>${scoreBar(it.similarity)}<span class="meta">${meta}</span></div>
      <div class="content ${long?"clip":""}" id="${cid}">${esc(body)}</div>
      ${long?`<button class="more" data-expand="${cid}">Show more</button>`:""}
      ${sub?`<div class="sub">${sub}</div>`:""}
    </div>`;
  }

  // ---- views ----
  const view = $("#view");
  const setActive = r => document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.route===r));
  const loading = () => { view.innerHTML = `<div class="skeleton"></div>`; };

  // guard wraps the loading()-based views (traces/detail/memory). On error it REPLACES the shimmering skeleton
  // with a message (search has its own handling — it must not clear its form).
  async function guard(fn){ try { await fn(); } catch(e){ if(e.code===401){ apiKey=""; localStorage.removeItem(KEY_STORE); renderGate("Your API key was rejected. Re-enter it below."); } else { view.innerHTML = `<div class="empty"><b>Couldn't load</b>${esc(e.message)}</div>`; } } }

  // Traces list
  let traceFilter = "all";
  async function renderTraces(){
    setActive("traces"); loading();
    await guard(async () => {
      const kindQ = traceFilter==="all" ? "" : "?kind="+encodeURIComponent(traceFilter);
      const { traces } = await api("/inspect"+kindQ);
      const head = `<div class="pagehead"><div><h1>Recall traces</h1><div class="sub">Every retrieval Eunoia performed, locally recorded — what it fetched, how strong, how fast.</div></div>
        <div class="tools">
          ${["all","search","proxy","tool_search"].map(k=>`<button class="chip ${traceFilter===k?"on":""}" data-filter="${k}">${k==="tool_search"?"tool-search":k}</button>`).join("")}
          <button class="btn" data-refresh><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-.5 3" stroke-linecap="round"/><path d="M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh</button>
        </div></div>`;
      if(!traces.length){ view.innerHTML = head + `<div class="empty"><b>No traces yet</b>Run a search in the Search tab — each recall is captured here.</div>`; wireTraces(); return; }
      const rows = traces.map(t=>`<div class="row fade" data-open="${esc(t.id)}" role="button" tabindex="0" aria-label="Open trace: ${esc(String(t.query || (t.queries&&t.queries[0]) || "trace").slice(0,80))}">
        <span class="when">${timeAgo(t.createdAt)}</span>
        <span class="kindcol">${kindBadge(t.kind)}</span>
        <span class="q">${esc(t.query || (t.queries&&t.queries[0]) || "—")}</span>
        <span class="num results">${t.kind==="proxy"?`<b>${t.injectedCount}</b> injected`:`<b>${t.resultCount}</b> hits`}</span>
        <span class="num">${t.latencyMs}<span class="faint">ms</span></span>
      </div>`).join("");
      view.innerHTML = head + `<div class="rows">${rows}</div>`;
      wireTraces();
    });
  }
  function wireTraces(){
    view.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ traceFilter=b.dataset.filter; renderTraces(); });
    const rf=view.querySelector("[data-refresh]"); if(rf) rf.onclick=renderTraces;
    view.querySelectorAll("[data-open]").forEach(r=>{ const go=()=>{ location.hash="#/trace/"+r.dataset.open; }; r.onclick=go; r.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }; });
  }

  // Trace detail — the hero
  async function renderTrace(id){
    setActive("traces"); loading();
    await guard(async () => {
      const { trace:t } = await api("/inspect/"+encodeURIComponent(id));
      const proxyNote = t.kind==="proxy" && t.status!=="answered" ? `<div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5" stroke-linecap="round"/><circle cx="12" cy="16" r=".6" fill="currentColor"/></svg><div><b>Context-injection trace.</b> This records what Eunoia injected (profile / tool / passthrough), <b>not</b> the model's final answer.</div></div>` : "";
      const retrieved = t.retrieved||[], injected = t.injected||[];
      view.innerHTML = `
        <a class="back" href="#/traces"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>All traces</a>
        <div class="card hero fade">
          <div class="top">${kindBadge(t.kind)} ${statusBadge(t.status)} ${t.searchMode?`<span class="tag">${esc(t.searchMode)}</span>`:""} ${t.containerTag?`<span class="tag">tag: ${esc(t.containerTag)}</span>`:""}<span class="when" title="${esc(fmtTime(t.createdAt))}">${fmtTime(t.createdAt)}</span></div>
          <div class="stats">
            <div class="stat"><div class="k">Latency</div><div class="v">${t.latencyMs}<small>ms</small></div></div>
            <div class="stat"><div class="k">Retrieved</div><div class="v">${t.resultCount}</div></div>
            <div class="stat"><div class="k">Injected</div><div class="v">${t.injectedCount}</div></div>
          </div>
          <div class="qbox"><div class="k">Query</div><div class="qt">${esc(t.query || (t.queries||[]).join("  •  ") || "—")}</div></div>
          ${proxyNote}
        </div>
        <div class="sec"><div class="hd"><h3>Retrieved</h3><span class="n">${retrieved.length} item${retrieved.length===1?"":"s"}, ranked by similarity</span></div>
          ${retrieved.length ? retrieved.map(retrievedItem).join("") : `<div class="empty">Nothing retrieved for this query.</div>`}</div>
        ${injected.length ? `<div class="sec"><div class="hd"><h3>Injected</h3><span class="n">fed into context</span></div>${injected.map(retrievedItem).join("")}</div>` : ""}
        <details class="raw"><summary>Raw trace record (exactly what Eunoia stored)</summary><pre>${esc(JSON.stringify(t,null,2))}</pre></details>`;
      view.querySelectorAll("[data-expand]").forEach(a=>a.onclick=()=>{ const c=view.querySelector("#"+a.dataset.expand); c.classList.toggle("clip"); a.textContent=c.classList.contains("clip")?"Show more":"Show less"; });
    });
  }

  // Search playground
  const searchState = { q:"", searchMode:"memories", limit:10, containerTag:"", keyword:true, threshold:"", last:null };
  function renderSearch(){
    setActive("search");
    const s = searchState;
    view.innerHTML = `<div class="pagehead"><div><h1>Search playground</h1><div class="sub">Run a recall and watch the trace it produces — the same path your agent takes.</div></div></div>
      <div class="card play">
        <div class="qrow"><input id="sq" placeholder="Ask what the user's memory should surface…" value="${esc(s.q)}" autofocus /><button class="btn primary" id="run">Run</button></div>
        <div class="controls">
          <label class="field"><span class="lab">Mode</span><select id="smode">${["memories","documents","hybrid"].map(m=>`<option ${s.searchMode===m?"selected":""}>${m}</option>`).join("")}</select></label>
          <label class="field"><span class="lab">Limit</span><input id="slimit" type="number" min="1" max="100" value="${s.limit}" /></label>
          <label class="field"><span class="lab">Container tag</span><input id="stag" placeholder="(all)" value="${esc(s.containerTag)}" /></label>
          <label class="field"><span class="lab">Threshold override</span><input id="sthr" placeholder="(model default)" value="${esc(s.threshold)}" /></label>
          <label class="toggle" style="align-self:end"><input type="checkbox" id="skw" ${s.keyword?"checked":""} ${s.searchMode==="memories"?"disabled":""} /> Fuse keyword (hybrid)</label>
        </div>
        <div class="runbar" id="runbar" aria-live="polite"></div>
        <div id="sresults"></div>
      </div>`;
    const run = async () => {
      s.q = $("#sq").value.trim(); s.searchMode=$("#smode").value; s.limit=Number($("#slimit").value)||10;
      s.containerTag=$("#stag").value.trim(); s.keyword=$("#skw").checked; s.threshold=$("#sthr").value.trim();
      if(!s.q){ $("#sq").focus(); return; }
      $("#run").disabled=true; $("#runbar").innerHTML=`<span class="res">searching…</span>`; $("#sresults").innerHTML="";
      const body = { q:s.q, searchMode:s.searchMode, limit:s.limit, keyword:s.keyword };
      if(s.containerTag) body.containerTag=s.containerTag;
      if(s.threshold!=="" && isFinite(Number(s.threshold))) body.threshold=Number(s.threshold);
      const t0=performance.now();
      try {
        const { results, traceId } = await api("/search",{ method:"POST", body:JSON.stringify(body) });
        const ms=Math.round(performance.now()-t0);
        $("#runbar").innerHTML = `<span class="res"><b>${results.length}</b> result${results.length===1?"":"s"} · ${ms}ms · trace ${traceId?`<a href="#/trace/${esc(traceId)}">${esc(traceId.slice(0,10))} →</a>`:"—"}</span>`;
        $("#sresults").innerHTML = results.length ? results.map(retrievedItem).join("") : `<div class="empty">No matches above the similarity floor. Try a broader query, a lower threshold, or a different mode.</div>`;
        $("#sresults").querySelectorAll("[data-expand]").forEach(a=>a.onclick=()=>{ const c=$("#"+a.dataset.expand); c.classList.toggle("clip"); a.textContent=c.classList.contains("clip")?"Show more":"Show less"; });
      } catch(e){
        if(e.code===401){ apiKey=""; localStorage.removeItem(KEY_STORE); renderGate("Your API key was rejected. Re-enter it below."); return; }
        $("#runbar").innerHTML = `<span class="res" style="color:#f0a595">Search failed: ${esc(e.message)}</span>`;
      } finally {
        const b=$("#run"); if(b) b.disabled=false;
      }
    };
    $("#run").onclick=run;
    $("#sq").addEventListener("keydown",e=>{ if(e.key==="Enter") run(); });
    $("#smode").addEventListener("change",()=>{ $("#skw").disabled = $("#smode").value==="memories"; }); // keyword fusion only applies to document/chunk search
    $("#sq").focus(); // autofocus attribute is ineffective when injected via innerHTML
  }

  // Memory browser
  async function renderMemory(){
    setActive("memory"); loading();
    await guard(async () => {
      const { memories } = await api("/memories?limit=100");
      const head = `<div class="pagehead"><div><h1>Memory browser</h1><div class="sub">The latest memories Eunoia holds — the store your agent recalls from.</div></div><div class="tools"><button class="btn" data-refresh><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-.5 3" stroke-linecap="round"/><path d="M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh</button></div></div>`;
      if(!memories.length){ view.innerHTML=head+`<div class="empty"><b>No memories stored</b>Write some via POST /memories, then they'll appear here.</div>`; const r=view.querySelector("[data-refresh]"); if(r)r.onclick=renderMemory; return; }
      const items = memories.map((m,i)=>{ const cid="m"+i; const long=(m.memory||"").length>200; return `<div class="card mem fade">
        <div class="mtop">${m.is_static?`<span class="badge b-both">static</span>`:`<span class="badge b-mem">dynamic</span>`}<span class="tag">v${m.version}</span><span class="tag">${esc(String(m.id).slice(0,10))}</span>${m.forget_after?`<span class="badge b-timeout">expires in ${esc(timeUntil(m.forget_after))}</span>`:""}<span class="when" title="${esc(fmtTime(m.created_at))}">${timeAgo(m.created_at)}</span></div>
        <div class="mtext ${long?"clip":""}" id="${cid}">${esc(m.memory)}</div>${long?`<button class="more" data-expand="${cid}">Show more</button>`:""}</div>`; }).join("");
      view.innerHTML = head + items;
      const r=view.querySelector("[data-refresh]"); if(r)r.onclick=renderMemory;
      view.querySelectorAll("[data-expand]").forEach(a=>a.onclick=()=>{ const c=view.querySelector("#"+a.dataset.expand); c.classList.toggle("clip"); a.textContent=c.classList.contains("clip")?"Show more":"Show less"; });
    });
  }

  // ---- connect gate ----
  function renderGate(msg){
    $("#app").hidden=true; const g=$("#gate"); g.hidden=false;
    g.innerHTML = `<div class="gate"><div class="card box fade">
      <svg class="mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="#56d1c4"/><circle cx="16" cy="16" r="13" fill="none" stroke="#56d1c4" stroke-opacity=".5" stroke-width="1.5"/></svg>
      <h2>Connect to Eunoia</h2>
      <p>This dashboard talks to your local Eunoia instance. Paste the API key (<span class="mono">EUNOIA_API_KEY</span>) to inspect your memory layer.</p>
      <label class="field"><span class="lab">API key</span><input id="gkey" type="password" placeholder="Bearer token" autocomplete="off" /></label>
      <div class="row2"><button class="btn primary" id="gconnect" style="flex:1;justify-content:center">Connect</button></div>
      <div class="err" id="gerr">${msg?esc(msg):""}</div>
      <div class="hint">Stored only in this browser (localStorage), never sent anywhere but <span class="mono">${esc(base)}</span>. No telemetry, no cloud.</div>
    </div></div>`;
    const input=$("#gkey"), btn=$("#gconnect"), err=$("#gerr");
    input.focus();
    const submit = async () => {
      const k=input.value.trim(); if(!k){ input.focus(); return; }
      btn.disabled=true; err.textContent="Checking…";
      const prev=apiKey; apiKey=k;
      try { await api("/inspect?limit=1"); localStorage.setItem(KEY_STORE,k); g.hidden=true; $("#app").hidden=false; route(); }
      catch(e){ apiKey=prev; err.textContent = e.code===401 ? "That key was rejected." : ("Could not reach the server: "+e.message); btn.disabled=false; }
    };
    btn.onclick=submit; input.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
  }

  // ---- router ----
  function route(){
    if(!apiKey){ renderGate(); return; }
    $("#gate").hidden=true; $("#app").hidden=false;
    const h=location.hash.replace(/^#\/?/,"");
    if(h.startsWith("trace/")) return renderTrace(decodeURIComponent(h.slice(6)));
    if(h==="search") return renderSearch();
    if(h==="memory") return renderMemory();
    return renderTraces();
  }

  document.querySelectorAll("#nav a").forEach(a=>a.onclick=e=>{ e.preventDefault(); location.hash="#/"+a.dataset.route; });
  $("#disconnect").onclick=()=>{ apiKey=""; localStorage.removeItem(KEY_STORE); if(location.hash) history.replaceState(null,"","#"); renderGate(); };
  window.addEventListener("hashchange", route);

  // boot: reflect connection, verify key silently, then route
  (async () => {
    if(apiKey){
      $("#dot").className="dot ok"; $("#connlabel").textContent=base.replace(/^https?:\/\//,""); $("#disconnect").hidden=false;
      try { await api("/inspect?limit=1"); } catch(e){ if(e.code===401){ apiKey=""; localStorage.removeItem(KEY_STORE); } }
    }
    if(apiKey){ $("#app").hidden=false; route(); } else { $("#dot").className="dot bad"; renderGate(); }
  })();
})();
</script>
</body>
</html>
