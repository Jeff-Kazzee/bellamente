# Dev: alias the native ONNX backend to the WASM one (mirrors build.ts) so `bun run` uses a single
# onnxruntime-web instance for both the transformers.js tokenizer and inference (no native, no conflict).
preload = ["./scripts/ort-alias-preload.ts"]

# Coverage gate: every `bun test` computes coverage and FAILS below these floors. This is the
# mechanical half of the test-first rule in AGENTS.md — new code cannot merge untested, no matter
# which model wrote it. Floors are a RATCHET: raise them as gaps fill (target: 1.0); never lower.
[test]
coverage = true
coverageSkipTestFiles = true
coverageThreshold = { functions = 0.90, lines = 0.91 }
