# Dev: alias the native ONNX backend to the WASM one (mirrors build.ts) so `bun run` uses a single
# onnxruntime-web instance for both the transformers.js tokenizer and inference (no native, no conflict).
preload = ["./scripts/ort-alias-preload.ts"]

# Coverage: every `bun test` computes coverage and writes an lcov report (coverage/lcov.info),
# consumed by the GLOBAL floor check in scripts/ci.ts. We deliberately do NOT set bunfig
# `coverageThreshold`: bun enforces it PER FILE, which trips integration-only files (embed.ts worker
# dispatch, index.ts Bun.serve boot, db.ts lock/crash paths) and makes `bun test` exit 1 even when the
# suite is green and GLOBAL coverage clears the floor (issue #96). `bun run ci` enforces the real
# global floor from the lcov report instead. The floor is a RATCHET: raise it as gaps fill
# (target: 1.0); never lower. Integration-only files are covered by the dogfood smoke, not by units.
[test]
coverage = true
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
# Global floor lives in scripts/ci.ts: WEIGHTED funcs 0.90 / lines 0.90 (real % = total covered/total
# found). The history below measured bun's UNWEIGHTED per-file mean (its "All files" row); on the
# weighted metric current coverage is 92.71 / 90.18, so lines was re-baselined 0.91→0.90 (2026-07-05)
# as a METRIC CORRECTION, not a lowering. History (unweighted mean): 2026-07-04 (#87) 90.64/91.91 ·
