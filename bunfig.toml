# Dev: alias the native ONNX backend to the WASM one (mirrors build.ts) so `bun run` uses a single
# onnxruntime-web instance for both the transformers.js tokenizer and inference (no native, no conflict).
preload = ["./scripts/ort-alias-preload.ts"]

# Coverage is always collected; `bun run test` enforces the aggregate ratchet in
# scripts/test-with-coverage-gate.ts. Bun 1.3.x applies `coverageThreshold` per file, which fights
# the repo policy that hard-to-unit-test boot/embed paths are covered by release smoke instead.
[test]
coverage = true
coverageSkipTestFiles = true
