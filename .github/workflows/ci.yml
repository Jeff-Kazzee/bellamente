name: CI
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install
        run: bun install
      - name: typecheck
        run: bunx tsc --noEmit
      - name: test
        # Judge by the PRINTED SUMMARY, not the exit code: bun test exits 1 under
        # coverage even when all-green and floors are met (issue #96).
        run: |
          bun test 2>&1 | tee test-out.txt || true
          grep -q " 0 fail" test-out.txt
      - name: build
        run: bun run build
