name: CI

on:
  pull_request:
    branches:
      - dev
      - prod
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests + release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Show tool versions
        run: |
          bun --version
          node --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=moderate

      - name: Cache Bellamente model/runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bellamente-cache
          key: ${{ runner.os }}-bellamente-model-runtime-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bellamente-model-runtime-

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test with aggregate coverage gate
        run: bun run test

      - name: Full functionality release smoke
        env:
          BELLA_CACHE_DIR: ${{ runner.temp }}/bellamente-cache
        run: bun run smoke

      - name: Build binary
        run: bun run build

      - name: Whitespace check
        run: git diff --check

      - name: No tracked generated drift
        shell: bash
        run: |
          git diff --exit-code
